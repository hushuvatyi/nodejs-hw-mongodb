tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: Contact's name
            type: string
            example: Robert
          phoneNumber:
            description: Contact's phone number
            type: string
            example: 00304050607
          email:
            description: Contact's email
            type: string
            example: robert3@mail.com
          isFavourite:
            description: Whether is contact favourite
            type: boolean
            example: true
          contactType:
            description: Student's contact type.
            type: string
            enum: ['work', 'home', 'personal']
            example: work
          userId:
            description: Contact's user id
            type: string
            example: 67b1e20bb30ae56660e4f84a
          photo:
            description: Link to contact's photo
            type: string
            example: https://res.cloudinary.com/dkcrus1e2/image/upload/v1740077482/vuv8umaav1in4nomc0cf.png
            format: binary
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: '../../components/responses/401.yaml'
