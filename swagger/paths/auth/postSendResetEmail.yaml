tags:
  - Auth
summary: Send reset password email
operationId: sendResetEmail
description: Send reset password email
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            type: string
            description: Registered user's email, that is using as a login
            example: user@mail.com
responses:
  '200':
    description: Successfully sent email with link to reset password page
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset password email was successfully sent!
            data:
              type: object
              description: "'data' is an empty object"
              example: {}
  '404':
    $ref: '../../components/responses/404.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
